# Docker Compose para desarrollo de ManageCharge

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: managecharge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # Credenciales del usuario root
      MONGO_INITDB_ROOT_USERNAME: managecharge_admin
      MONGO_INITDB_ROOT_PASSWORD: managecharge_secret_2024
      MONGO_INITDB_DATABASE: managecharge
    volumes:
      - mongodb_data:/data/db
    networks:
      - managecharge-network

  mongo-express:
    image: mongo-express:1.0.0
    container_name: managecharge-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      # Credenciales para conectar a MongoDB
      ME_CONFIG_MONGODB_ADMINUSERNAME: managecharge_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: managecharge_secret_2024
      # Credenciales para acceder a Mongo Express (interfaz web)
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - managecharge-network

volumes:
  mongodb_data:
    driver: local

networks:
  managecharge-network:
    driver: bridge