# Docker Compose para desarrollo de ManageCharge
#
# Las credenciales NO se escriben aquí: Docker Compose las lee
# automáticamente del archivo .env que está en esta misma carpeta.
# Copia .env.example a .env y completa los valores.

services:
  mongodb:
    image: mongo:7.0
    container_name: managecharge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Define MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: managecharge
    volumes:
      - mongodb_data:/data/db
    networks:
      - managecharge-network

  mongo-express:
    image: mongo-express:1.0.0
    container_name: managecharge-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:?Define MONGO_EXPRESS_USERNAME en .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Define MONGO_EXPRESS_PASSWORD en .env}
    depends_on:
      - mongodb
    networks:
      - managecharge-network

volumes:
  mongodb_data:
    driver: local

networks:
  managecharge-network:
    driver: bridge
